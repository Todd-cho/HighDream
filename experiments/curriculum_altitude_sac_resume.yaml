name: altitude_safe_curriculum_sac_resume
script: train_curriculum

output:
  name: highdream
  tag: altitude_curriculum_v1

env:
  observation_mode: tactical16
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.my_reward

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 10000
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu

runtime:
  num_env_runners: 1
  resume: true

curriculum:
  stages_module: student.my_curriculum

policy_probe:
  enabled: true
  interval: 20
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 50
  steps: 600
  episodes: 1
  print: true

notes: "Resume altitude-first SAC curriculum v1."
