# diag_v5 - range reward 가중치 증폭 테스트
# diag_v4(my_reward_seunghyun_v3, 정상 가중치)와 control(my_reward, 정상 가중치)이
# 150iter/57episode 규모에서 거의 차이 없었던 이유 중 하나로 "range reward 신호 자체가
# 다른 보상항(altitude/step_penalty)에 비해 너무 약한 거 아니냐"는 가설을 세움.
# diag_v4와 완전히 동일한 조건(R08 init, 150iter, my_reward_seunghyun_v3)에서
# range_scale과 far_range_penalty만 키워서 신호를 증폭시킴:
#   range_scale: 0.35 -> 1.0 (약 3배)
#   far_range_penalty: 1.00 -> 3.0 (3배)
# 나머지 파라미터/시나리오/알고리즘은 diag_v4와 전부 동일.

name: seunghyun_diag_v5_amplified_range_weight
script: train_rllib

output:
  name: highdream
  tag: diag_v5_seunghyun_amplified_weight

env:
  observation_mode: tactical16
  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.my_reward_seunghyun_v3
  max_engage_time: 60.0
  episode_step_limit: 750

env_config:
  step_ratio: 6
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  initial_scenario:
    mode: scenario_pool
    scenarios:
      - name: step4_2km_level_slow
        weight: 0.35
        ownship: [1000.0, 0.0, -9000.0, 0.0, 0.0, 0.0, 260.0]
        target: [3000.0, 0.0, -9000.0, 0.0, 0.0, 180.0, 250.0]
        target_mode: fixed
      - name: step4_2p5km_left_offset
        weight: 0.30
        ownship: [1000.0, -500.0, -9000.0, 0.0, 0.0, 12.0, 260.0]
        target: [3500.0, 500.0, -9000.0, 0.0, 0.0, 180.0, 250.0]
        target_mode: fixed
      - name: step4_2p5km_right_offset
        weight: 0.25
        ownship: [1000.0, 500.0, -9000.0, 0.0, 0.0, -12.0, 260.0]
        target: [3500.0, -500.0, -9000.0, 0.0, 0.0, 180.0, 250.0]
        target_mode: fixed
      - name: step4_3km_level
        weight: 0.10
        ownship: [1000.0, 0.0, -9500.0, 0.0, 0.0, 0.0, 270.0]
        target: [4000.0, 0.0, -9500.0, 0.0, 0.0, 180.0, 250.0]
        target_mode: fixed
    ownship_randomization:
      enabled: true
      radius: 120.0
      r_roll: 3.0
      r_pitch: 2.0
      r_heading: 8.0
      speed_mps: 4.0
    target_randomization:
      enabled: true
      radius: 80.0
      r_roll: 0.0
      r_pitch: 0.0
      r_heading: 5.0
      speed_mps: 3.0
    shared_randomization:
      enabled: true
      n_m: 80.0
      e_m: 80.0
      d_m: 50.0
      speed_mps: 2.0

  target_loiter:
    enabled: true
    bank: 30.0
    pitch: 0.0
  target_autopilot:
    heading_cmd: 180.0
    altitude_cmd: 7000.0
    speed_cmd: 250.0

  reward:
    mode: default

    step_penalty: -0.0008

    too_close_m: 450.0
    ideal_range_min_m: 500.0
    ideal_range_max_m: 1400.0
    range_scale: 1.0
    overshoot_penalty: 3.5
    overshoot_quadratic_scale: 1.0
    inside_min_range_penalty: -2.5

    ata_scale: 0.08
    aa_scale: 0.005
    wez_bonus: 0.0
    damage_scale: 0.0

    altitude_soft_floor_m: 2400.0
    altitude_hard_floor_m: 900.0
    low_altitude_penalty: 1.0
    very_low_altitude_penalty: 2.2
    altitude_bonus_mid_min_m: 800.0
    altitude_bonus_high_min_m: 1800.0
    altitude_bonus_high_max_m: 7000.0
    altitude_bonus_mid: 1.0
    altitude_bonus_high: 1.0
    nose_down_altitude_m: 4500.0
    nose_down_pitch_deg: -8.0
    nose_down_penalty: -1.0

    roll_limit_deg: 85.0
    roll_limit_penalty: 0.10
    pitch_down_limit_deg: -24.0
    pitch_down_penalty: 0.4
    pitch_up_limit_deg: 40.0
    pitch_up_penalty: 0.1

    attack_range_min_m: 300.0
    attack_range_max_m: 1800.0
    attack_range_bonus: 0.30
    far_range_penalty_start_m: 1800.0
    far_range_penalty: 3.0

    win_reward: 80.0
    loss_reward: -100.0
    draw_reward: 10.0
    crash_penalty: -300.0

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 10000
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu

runtime:
  iterations: 150
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  checkpoint_frequency: 0
  save_native_checkpoint: false
  init_bundle: artifacts/models/highdream/altitude_c05_refine_v1_validation_R08_r1_150iter

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 15
  steps: 600
  episodes: 1
  print: true

notes: "diag_v5 - range_scale 0.35->1.0, far_range_penalty 1.00->3.0로 증폭. 나머지는 diag_v4와 완전 동일(R08 init, 150iter, my_reward_seunghyun_v3). control/diag_v4 대비 distance_mean이 유의미하게 줄어드는지 확인."
